{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-md-8 offset-md-2">
            <div class="card">
                <div class="card-header">
                    <h4>Settings</h4>
                </div>
                <div class="card-body">
                    <form method="POST">
                        <!-- Online Status -->
                        <div class="mb-4">
                            <h5 class="mb-3">Online Status</h5>
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="show_online_status" 
                                       name="show_online_status" {% if settings.show_online_status %}checked{% endif %}>
                                <label class="form-check-label" for="show_online_status">
                                    Show when I'm online
                                </label>
                            </div>
                        </div>

                        <!-- Theme Selection -->
                        <div class="mb-4">
                            <h5 class="mb-3">Theme</h5>
                            <div class="btn-group" role="group">
                                <input type="radio" class="btn-check" name="theme" id="light" value="light" 
                                       {% if settings.theme == 'light' %}checked{% endif %}>
                                <label class="btn btn-outline-primary" for="light">Light</label>

                                <input type="radio" class="btn-check" name="theme" id="dark" value="dark" 
                                       {% if settings.theme == 'dark' %}checked{% endif %}>
                                <label class="btn btn-outline-primary" for="dark">Dark</label>

                                <input type="radio" class="btn-check" name="theme" id="dynamic" value="dynamic" 
                                       {% if settings.theme == 'dynamic' %}checked{% endif %}>
                                <label class="btn btn-outline-primary" for="dynamic">Dynamic</label>
                            </div>
                        </div>

                        <!-- Blocked Users -->
                        <div class="mb-4">
                            <h5 class="mb-3">Blocked Users</h5>
                            <div class="list-group">
                                {% for block in current_user.blocked_users %}
                                    <div class="list-group-item d-flex justify-content-between align-items-center">
                                        <div>
                                            <img src="{{ url_for('uploaded_file', filename=block.blocked.get_profile_picture) }}" 
                                                 class="rounded-circle me-2" width="32" height="32">
                                            {{ block.blocked.username }}
                                        </div>
                                        <form action="{{ url_for('unblock_user', user_id=block.blocked.id) }}" method="POST" class="d-inline">
                                            <button type="submit" class="btn btn-sm btn-danger">Unblock</button>
                                        </form>
                                    </div>
                                {% else %}
                                    <div class="list-group-item text-muted">
                                        You haven't blocked any users
                                    </div>
                                {% endfor %}
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary">Save Changes</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    // Theme switcher
    document.addEventListener('DOMContentLoaded', function() {
        function setTheme(theme) {
            document.documentElement.setAttribute('data-bs-theme', theme);
            localStorage.setItem('theme', theme);
        }

        const themeInputs = document.querySelectorAll('input[name="theme"]');
        themeInputs.forEach(input => {
            input.addEventListener('change', function() {
                if (this.value === 'dynamic') {
                    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                    setTheme(prefersDark ? 'dark' : 'light');
                } else {
                    setTheme(this.value);
                }
            });
        });

        // Handle dynamic theme changes
        if (document.querySelector('input[value="dynamic"]:checked')) {
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
                if (document.querySelector('input[value="dynamic"]:checked')) {
                    setTheme(e.matches ? 'dark' : 'light');
                }
            });
        }
    });
</script>
{% endblock %}
